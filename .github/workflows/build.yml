# Verifiable release build — every artifact CircuitOS ships is produced by this public workflow,
# which is a SignPath Foundation requirement (binaries must be built from source in a verifiable way).
# The build is UNSIGNED here; signing happens as a separate manually-approved SignPath step.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run smoke tests
        run: dotnet run --project tools/runtime.tests/CircuitOS.Runtime.SmokeTests.csproj -c Release -- data

      - name: Build runtime for startup regressions
        run: dotnet build tools/runtime/CircuitOS.Runtime.csproj -c Release

      - name: Run cloud and startup regressions
        run: dotnet run --project tools/cloud.tests/CircuitOS.Cloud.Tests.csproj -c Release -- --runtime tools/runtime/bin/Release/net9.0-windows/CircuitOS.dll

      - name: Run Twitch regressions
        run: dotnet run --project tools/twitch.tests/CircuitOS.Twitch.Tests.csproj -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run admin editor regressions
        run: node --test tools/admin.tests/editor-state.test.cjs

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Build installer + update packages (unsigned)
        shell: pwsh
        run: ./tools/package/Build-CircuitOSVelopack.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircuitOS-velopack
          path: dist/velopack/
